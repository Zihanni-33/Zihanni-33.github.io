   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
   
<script>
(function(){
  const c=document.getElementById('globalStars');
  const x=c.getContext('2d');let s=[];
  function rs(){c.width=window.innerWidth;c.height=Math.max(document.body.scrollHeight,window.innerHeight);}
  rs();window.addEventListener('resize',()=>{rs();is();});
  function is(){s=[];for(let i=0;i<120;i++)s.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,t:Math.random()*Math.PI*2,sp:Math.random()*0.02+0.005});}
  is();
  function ds(){x.clearRect(0,0,c.width,c.height);s.forEach(p=>{p.t+=p.sp;const a=0.2+Math.sin(p.t)*0.2;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle=`rgba(180,160,220,${a})`;x.fill();});requestAnimationFrame(ds);}
  ds();window.addEventListener('scroll',()=>{rs();is();});
})();
</script>
